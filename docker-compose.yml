services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stashit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stashit
      POSTGRES_PASSWORD: stashit
      POSTGRES_DB: stashit
    ports:
      - "5435:5432"
    volumes:
      - stashit-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashit -d stashit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stashit-redis
    restart: unless-stopped
    ports:
      - "6385:6379"
    volumes:
      - stashit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stashit-pg-data:
  stashit-redis-data:
