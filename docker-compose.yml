services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stashbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stashbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stashbox}
      POSTGRES_DB: ${POSTGRES_DB:-stashbox}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - stashbox-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stashbox} -d ${POSTGRES_DB:-stashbox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stashbox-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - stashbox-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stashbox-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      DATABASE_URL: postgres://${POSTGRES_USER:-stashbox}:${POSTGRES_PASSWORD:-stashbox}@postgres:5432/${POSTGRES_DB:-stashbox}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3333/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stashbox-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      DATABASE_URL: postgres://${POSTGRES_USER:-stashbox}:${POSTGRES_PASSWORD:-stashbox}@postgres:5432/${POSTGRES_DB:-stashbox}
      REDIS_URL: redis://redis:6379
    command: ["node", "ace", "queue:listen"]

volumes:
  stashbox-pg-data:
  stashbox-redis-data:
